services:
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["datos-mongo:/data/db"]
    healthcheck:
      # Inicia el replica set (necesario para transacciones) si aún no existe.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  mock-modulos:
    build: { context: ., dockerfile: apps/mock-modulos/Dockerfile }
    ports: ["3001:3001"]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    ports: ["3000:3000"]
    depends_on:
      mongo: { condition: service_healthy }
      mock-modulos: { condition: service_started }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  datos-mongo:
